name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resume-engine/api prisma:generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: pnpm lint
      - run: pnpm check:tokens

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resume-engine/api prisma:generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      # The pipeline tests convert a real DOCX to PDF with LibreOffice.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resume-engine/api prisma:generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: pnpm test

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resume-engine/api prisma:generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: pnpm build
